name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - name: Install dependencies
        run: |
          pip install \
            "homeassistant==2026.8.3" \
            "aiousbwatcher==1.1.2" \
            "pymonoprice==0.6.1" \
            "serialx==1.8.2" \
            mypy \
            pytest \
            pytest-asyncio \
            pytest-homeassistant-custom-component \
            ruff
      - name: Ruff
        run: ruff check custom_components tests
      - name: Mypy
        run: mypy --ignore-missing-imports --follow-imports=skip --allow-untyped-decorators custom_components/monoprice_custom
      - name: Run tests
        run: pytest -v
