snapshot:
  target:
    entity:
      integration: monoprice
      domain: media_player

restore:
  target:
    entity:
      integration: monoprice
      domain: media_player

set_balance:
  target:
    entity:
      integration: monoprice
      domain: media_player
  fields:
    level:
      description: integer from 0 to 20 inclusive, where 0 is -10(left), 0 is center and 20 is +10 (right).
      required: true
      example: "10"
      default: "0"

set_bass:
  target:
    entity:
      integration: monoprice
      domain: media_player
  fields:
    level:
      description: Integer from 0 to 14 inclusive.
      required: true
      example: "10"
      default: "7"
  
set_treble:
  target:
    entity:
      integration: monoprice
      domain: media_player
  fields:
    level:
      description: Integer from 0 to 14 inclusive.
      required: true
      example: "10"
      default: "7"

set_baud_rate:
  target:
    entity:
      integration: monoprice
      domain: remote
  fields:
    baud_rate:
      description: Target RS-232 link speed. Must be one of the amplifier's supported rates.
      required: true
      example: "38400"
      default: "9600"
      selector:
        select:
          options:
            - "9600"
            - "19200"
            - "38400"
            - "57600"
            - "115200"
            - "230400"
